<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">S+ tree lower-bound search for the query 6</title>
  <desc id="desc">The root separators are 5 and 14. Three sorted leaf nodes contain 2 and 5, 5 and 9, and 14 followed by padding. Query 6 selects child 1, then slot 1, returning sorted position 3, whose key is 9. The illustration uses two keys per node.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker>
    <marker id="selected" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; font-size: 15px; }
      .key { font-family: Consolas, monospace; font-size: 30px; text-anchor: middle; }
      .accent { fill: #0f766e; font-weight: bold; }
      .center { text-anchor: middle; }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="648" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="30" y="42" font-size="26" font-weight="bold">S+ tree: lower_bound(6)</text>
  <text x="30" y="72" class="muted">Keys: [2, 5, 5, 9, 14]  ·  Highlighted path returns position 3, whose key is 9.</text>

  <text x="560" y="112" class="muted center">Internal node: separators copied from the right subtrees</text>
  <rect x="430" y="126" width="260" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <path d="M560 126 V206" stroke="#cbd5e1" stroke-width="2"/>
  <text x="495" y="177" class="key">5</text>
  <text x="625" y="177" class="key">14</text>

  <path d="M480 206 C420 265 190 260 190 325" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M560 206 V325" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#selected)"/>
  <path d="M640 206 C700 265 930 260 930 325" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="257" class="muted center">q ≤ 5</text>
  <text x="585" y="257" class="accent" font-size="17">5 &lt; q ≤ 14</text>
  <text x="585" y="282" class="muted">child = 1</text>
  <text x="930" y="257" class="muted center">q &gt; 14</text>

  <rect x="70" y="330" width="240" height="85" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <path d="M190 330 V415" stroke="#cbd5e1" stroke-width="2"/>
  <text x="130" y="384" class="key">2</text>
  <text x="250" y="384" class="key">5</text>
  <text x="190" y="442" class="muted center">Leaf 0: sorted positions 0, 1</text>

  <rect x="440" y="330" width="240" height="85" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <rect x="561" y="332" width="116" height="80" rx="6" fill="#ccfbf1"/>
  <path d="M560 330 V415" stroke="#0f766e" stroke-width="2"/>
  <text x="500" y="384" class="key">5</text>
  <text x="620" y="384" class="key accent">9</text>
  <text x="560" y="442" class="accent center" font-size="15">Leaf 1: positions 2, 3  ·  slot = 1</text>

  <rect x="810" y="330" width="240" height="85" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <path d="M930 330 V415" stroke="#cbd5e1" stroke-width="2"/>
  <text x="870" y="384" class="key">14</text>
  <text x="990" y="367" class="muted center" font-weight="bold">MAX</text>
  <text x="990" y="391" class="muted center">padding</text>
  <text x="930" y="442" class="muted center">Leaf 2: position 4; last slot is padding</text>

  <text x="30" y="479" class="muted">Original sorted positions</text>
  <rect x="350" y="489" width="420" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="602" y="490" width="84" height="54" fill="#ccfbf1"/>
  <path d="M434 489 V545 M518 489 V545 M602 489 V545 M686 489 V545" stroke="#cbd5e1"/>
  <text x="392" y="526" class="key" style="font-size:24px">2</text>
  <text x="476" y="526" class="key" style="font-size:24px">5</text>
  <text x="560" y="526" class="key" style="font-size:24px">5</text>
  <text x="644" y="526" class="key accent" style="font-size:24px">9</text>
  <text x="728" y="526" class="key" style="font-size:24px">14</text>
  <text x="392" y="569" class="muted center">0</text>
  <text x="476" y="569" class="muted center">1</text>
  <text x="560" y="569" class="muted center">2</text>
  <text x="644" y="569" class="accent center" font-size="16">3</text>
  <text x="728" y="569" class="muted center">4</text>
  <text x="30" y="607" class="accent" font-size="20">Result: child 1 × 2 keys per leaf + slot 1 = sorted position 3</text>
  <text x="30" y="634" class="muted">Illustration: 2 keys per node. Default implementation: 16-key, 64-byte-aligned nodes.</text>
</svg>
