name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=g++ -DSST_TEST_AVX2=ON
          - name: Linux Clang
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=clang++ -DSST_TEST_AVX2=ON
          - name: Windows MSVC
            os: windows-2022
            configure: -A x64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error --parallel 2
      - name: Configure consumer
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build consumer
        run: cmake --build build/consumer --config Release --parallel 2
      - name: Test consumer
        run: ctest --test-dir build/consumer -C Release --output-on-failure --no-tests=error

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=g++ -DSST_ENABLE_SANITIZERS=ON -DSST_TEST_AVX2=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel 1
